name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libgl1-mesa-dev \
            libvulkan-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            qt6-base-dev \
            qt6-tools-dev \
            xvfb

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          xvfb-run ctest --output-on-failure

  test-fedora:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            cmake \
            gcc-c++ \
            git-core \
            libX11-devel \
            libxcb-devel \
            libxkbcommon-devel \
            make \
            mesa-libGL-devel \
            qt6-qtbase-devel \
            qt6-qttools-devel \
            vulkan-headers \
            vulkan-loader-devel \
            xorg-x11-server-Xvfb

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          xvfb-run ctest --output-on-failure

  test-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize pacman keyring
        run: |
          pacman-key --init
          pacman-key --populate

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            cmake \
            git \
            libx11 \
            libxcb \
            libxkbcommon \
            mesa \
            qt6-base \
            qt6-tools \
            vulkan-headers \
            vulkan-icd-loader \
            xvfb

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          xvfb-run ctest --output-on-failure
