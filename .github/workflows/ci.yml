name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            distro: ubuntu
          - os: ubuntu-latest
            distro: fedora
          - os: ubuntu-latest
            distro: arch

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu 22.04)
        if: matrix.distro == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            cmake \
            build-essential \
            qt6-base-dev \
            qt6-tools-dev \
            libqt6opengl6-dev \
            libqt6sql6-sqlite \
            libgl1-mesa-dev \
            libfreetype-dev \
            libxcb-keysyms1-dev \
            xvfb

      - name: Install dependencies (Fedora)
        if: matrix.distro == 'fedora'
        run: |
          sudo dnf install -y \
            git \
            cmake \
            gcc-c++ \
            make \
            qt6-qtbase-devel \
            qt6-qttools-devel \
            mesa-libGL-devel \
            freetype-devel \
            libxcb-devel \
            xcb-util-keysyms-devel \
            xorg-x11-server-Xvfb

      - name: Install dependencies (Arch)
        if: matrix.distro == 'arch'
        run: |
          sudo pacman -Syu --noconfirm
          sudo pacman -S --noconfirm \
            git \
            cmake \
            base-devel \
            qt6-base \
            mesa \
            freetype2 \
            libxcb \
            xcb-util-keysyms \
            xorg-server-xvfb

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          xvfb-run --auto-servernum ctest --output-on-failure
