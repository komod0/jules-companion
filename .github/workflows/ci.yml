name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Ubuntu job runs natively on ubuntu-22.04
  test-ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            cmake \
            build-essential \
            qt6-base-dev \
            qt6-tools-dev \
            libqt6opengl6-dev \
            libqt6sql6-sqlite \
            libgl1-mesa-dev \
            libfreetype-dev \
            libxcb-keysyms1-dev \
            xvfb

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          xvfb-run --auto-servernum ctest --output-on-failure

  # Fedora job runs in Docker container
  test-fedora:
    runs-on: ubuntu-latest
    container:
      image: fedora:39
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            git \
            cmake \
            gcc-c++ \
            make \
            qt6-qtbase-devel \
            qt6-qttools-devel \
            mesa-libGL-devel \
            freetype-devel \
            libxcb-devel \
            xcb-util-keysyms-devel \
            xorg-x11-server-Xvfb \
            mesa-dri-drivers

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          xvfb-run --auto-servernum ctest --output-on-failure

  # Arch job runs in Docker container
  test-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Update system and install git
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -S --noconfirm \
            cmake \
            base-devel \
            qt6-base \
            mesa \
            freetype2 \
            libxcb \
            xcb-util-keysyms \
            xorg-server-xvfb

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          xvfb-run --auto-servernum ctest --output-on-failure
